name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check entry points
        run: node --check src/index.js && for f in src/tools/*.js; do node --check "$f"; done && node --check cli/dsh-forge.mjs && node --check core/mode.js

      - name: Core module load check
        run: node --input-type=module -e "import('./core/index.js').then(m => console.log('core ok', Object.keys(m).length))"

      - name: Doc-consistency guard
        run: node scripts/check-doc-consistency.mjs

      - name: Run self-contained test suites
        run: |
          for file in test/*.mjs; do
            case "$file" in
              *smoke13.test.mjs)
                echo "SKIP $file (依赖本机路径 / 真实 harness，CI 不运行)"
                ;;
              *)
                echo "RUN $file"
                node "$file" || exit 1
                ;;
            esac
          done